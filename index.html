<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>溯世行 — 宿命国风横版跑酷</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#c62828">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  background:#050505;display:flex;justify-content:center;align-items:center;
  height:100vh;overflow:hidden;font-family:'STKaiti','KaiTi','楷体','STSong','SimSun','宋体',serif;
  user-select:none;-webkit-user-select:none;cursor:default;
}
#gc{
  position:relative;width:1280px;height:720px;
  border:3px solid #3a2a12;border-radius:8px;overflow:hidden;
  box-shadow:0 0 100px rgba(180,120,40,0.3),0 0 250px rgba(0,0,0,0.9),inset 0 0 60px rgba(0,0,0,0.3);
}
canvas{display:block;width:100%;height:100%}

/* 四角装饰（增强） */
.corner{position:absolute;width:35px;height:35px;z-index:25;pointer-events:none;opacity:.7}
.corner.tl{top:6px;left:6px;border-top:2.5px solid #d0b070;border-left:2.5px solid #d0b070;border-radius:2px 0 0 0}
.corner.tr{top:6px;right:6px;border-top:2.5px solid #d0b070;border-right:2.5px solid #d0b070;border-radius:0 2px 0 0}
.corner.bl{bottom:6px;left:6px;border-bottom:2.5px solid #d0b070;border-left:2.5px solid #d0b070;border-radius:0 0 0 2px}
.corner.br{bottom:6px;right:6px;border-bottom:2.5px solid #d0b070;border-right:2.5px solid #d0b070;border-radius:0 0 2px 0}

/* ─── 覆盖层 ─── */
#ol{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  pointer-events:none;z-index:20;
}
#ol.active{pointer-events:auto}

/* ─── 标题画面（增强） ─── */
#ts{display:flex;flex-direction:column;align-items:center;gap:22px}
#ts .gt{
  font-size:92px;color:#f5e6c8;letter-spacing:32px;
  text-shadow:0 0 80px rgba(200,160,80,0.95),0 0 160px rgba(180,120,40,0.5),0 8px 16px rgba(0,0,0,0.8);
  font-family:'STKaiti','楷体',serif;animation:gtGlow 3s ease-in-out infinite;
}
@keyframes gtGlow{
  0%,100%{text-shadow:0 0 80px rgba(200,160,80,.95),0 0 160px rgba(180,120,40,.5),0 8px 16px rgba(0,0,0,.8)}
  50%{text-shadow:0 0 100px rgba(220,180,100,.95),0 0 200px rgba(200,140,60,.6),0 10px 20px rgba(0,0,0,.9)}
}
#ts .st{
  font-size:19px;color:#b8a070;letter-spacing:12px;text-shadow:0 0 15px rgba(180,120,40,0.5);
  position:relative;
}
#ts .st::before,#ts .st::after{
  content:'——';color:#8a7050;margin:0 12px;letter-spacing:2px;
}
#ts .info{color:#909090;font-size:13px;text-align:center;line-height:2.2;margin-top:10px;letter-spacing:1.5px}
#ts .kw{color:#d0a040;font-weight:bold;text-shadow:0 0 8px rgba(200,160,80,.3)}

/* ─── 按钮（增强） ─── */
.btn{
  padding:18px 72px;font-size:22px;
  background:linear-gradient(180deg,#7b3f15 0%,#9b5523 30%,#6b3410 100%);
  color:#f5e6c8;border:2px solid #c8a860;border-radius:6px;cursor:pointer;
  font-family:inherit;letter-spacing:10px;
  transition:all .4s;text-shadow:0 2px 6px rgba(0,0,0,.6);
  position:relative;overflow:hidden;
  box-shadow:0 6px 25px rgba(0,0,0,.5),0 0 40px rgba(200,160,80,.15),inset 0 1px 0 rgba(255,215,0,.25);
}
.btn::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.25),transparent);
  transition:left .6s;
}
.btn:hover::before{left:100%}
.btn:hover{
  background:linear-gradient(180deg,#9b5523 0%,#c87137 30%,#9b5523 100%);
  box-shadow:0 8px 35px rgba(200,160,80,.5),0 0 60px rgba(200,160,80,.25),inset 0 1px 0 rgba(255,215,0,.35);
  transform:translateY(-3px);
}
.btn:active{transform:scale(.96) translateY(1px);transition:transform .1s}

/* ─── 结算画面 ─── */
#gos{display:none;flex-direction:column;align-items:center;gap:16px}
#gos .got{font-size:50px;color:#c04040;letter-spacing:10px;text-shadow:0 0 30px rgba(200,60,60,.7)}
#gos .gosc{font-size:28px;color:#f0d080;letter-spacing:4px}
#gos .gost{
  font-size:15px;color:#b0a090;letter-spacing:3px;
  max-width:560px;text-align:center;line-height:1.8;font-style:italic;
}
#gos .gosd{font-size:13px;color:#807060;margin-top:4px;text-align:center;line-height:1.6}

/* ─── HUD ─── */
#hud{
  position:absolute;top:14px;left:20px;right:20px;display:none;
  justify-content:space-between;align-items:flex-start;z-index:10;pointer-events:none;
}
#hud>div{color:#e8d5b0;font-size:15px;text-shadow:0 0 10px rgba(0,0,0,.9),0 0 20px rgba(200,160,80,.3);letter-spacing:2px}
#hud .dn{font-size:22px;color:#f0d080;letter-spacing:5px;text-shadow:0 0 15px rgba(200,160,80,.4)}
#hud .sk{color:#c0a0ff;font-size:13px;text-shadow:0 0 8px rgba(180,150,255,.3)}
#hud .hud-left{display:flex;flex-direction:column;gap:5px}

/* 血量条 */
.health-bar{
  width:150px;height:7px;background:rgba(255,255,255,.08);
  border-radius:4px;overflow:hidden;border:1px solid rgba(200,160,80,.15);
}
.health-fill{
  height:100%;border-radius:4px;transition:width .3s,width .3s;
  background:linear-gradient(90deg,#c8a860,#e0a040,#cc4422);
  width:0%;
  box-shadow:0 0 6px rgba(200,160,80,.3);
}

/* ─── 关卡进度条 ─── */
#pb{
  position:absolute;top:52px;left:20px;right:20px;height:4px;
  background:rgba(255,255,255,.05);border-radius:2px;z-index:10;display:none;
  border:1px solid rgba(200,160,80,.08);
}
.pbf{
  height:100%;border-radius:2px;width:0%;transition:width .5s;
  background:linear-gradient(90deg,#6b4a14,#c8a860,#f0d080);
  box-shadow:0 0 8px rgba(200,160,80,.3);
}

/* ─── 技能栏（增强） ─── */
#sb{
  position:absolute;bottom:72px;left:50%;transform:translateX(-50%);
  display:none;gap:12px;z-index:10;pointer-events:none;
}
#sb .sc{
  width:50px;height:50px;border:2px solid #5a4a30;border-radius:8px;
  background:rgba(20,15,10,.9);display:flex;align-items:center;justify-content:center;
  color:#8a7a5a;font-size:21px;transition:all .4s;position:relative;
  backdrop-filter:blur(4px);
}
#sb .sc.ready{
  border-color:#c0a040;color:#f0d080;
  box-shadow:0 0 18px rgba(200,160,80,.5),inset 0 0 10px rgba(200,160,80,.12);
}
#sb .sc.used{border-color:#4a2020;color:#602020;background:rgba(30,10,10,.85)}
#sb .sc.ready::after{
  content:'';position:absolute;inset:-3px;border-radius:10px;
  background:radial-gradient(circle,rgba(200,160,80,.15),transparent 70%);
  pointer-events:none;
}

/* ─── 叙事文本框（增强） ─── */
#nt{
  position:absolute;bottom:130px;left:50%;transform:translateX(-50%);
  max-width:720px;padding:20px 36px;
  background:rgba(10,8,5,.93);border:1px solid #5a4828;
  color:#d0c0a0;font-size:15px;letter-spacing:2.5px;line-height:2;
  text-align:center;z-index:15;pointer-events:none;
  opacity:0;transition:opacity .8s;border-radius:5px;
  text-shadow:0 0 10px rgba(0,0,0,.6);
  box-shadow:0 6px 30px rgba(0,0,0,.6),0 0 20px rgba(200,160,80,.08);
}
#nt.show{opacity:1}
#nt .ntn{color:#f0d080;font-size:14px;margin-bottom:6px;letter-spacing:4px;text-shadow:0 0 8px rgba(200,160,80,.3)}

/* ─── 技能提示 ─── */
#sh{
  position:absolute;bottom:100px;left:50%;transform:translateX(-50%);
  color:#f0d080;font-size:14px;letter-spacing:3px;z-index:10;pointer-events:none;
  opacity:0;transition:opacity .4s;text-shadow:0 0 12px rgba(0,0,0,.9);
}
#sh.show{opacity:1}

/* ─── 过场 ─── */
#tsc{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.88);display:none;flex-direction:column;
  justify-content:center;align-items:center;z-index:25;
}
#tsc .tscn{font-size:46px;color:#f0d080;letter-spacing:14px;text-shadow:0 0 30px rgba(200,160,80,.6)}
#tsc .tscs{font-size:16px;color:#a09080;letter-spacing:6px;margin-top:10px}
#tsc .tsct{
  font-size:18px;color:#c0b090;max-width:600px;text-align:center;
  line-height:1.9;margin-top:18px;font-style:italic;letter-spacing:2px;
}

/* ─── 移动端 ─── */
#mbs{display:none;position:absolute;bottom:10px;right:10px;z-index:30;gap:6px}
@media(pointer:coarse){
  #mbs{display:flex}
  #mbs .mb{
    width:46px;height:46px;background:rgba(20,15,10,.85);
    border:2px solid #5a4a30;border-radius:8px;color:#c0a860;font-size:10px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1.2;-webkit-tap-highlight-color:transparent;
  }
  .mb:active{border-color:#f0d080;color:#f0d080}
}
@media(max-width:1300px){#gc{width:100vw;height:56.25vw;max-height:100vh}}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>

  <!-- 四角装饰 -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-left">
      <div>🏃 <span id="sd">0</span> 丈</div>
      <div class="health-bar"><div class="health-fill" id="hbf"></div></div>
    </div>
    <div class="dn" id="dd">鸿蒙初开</div>
    <div class="sk">💎 <span id="frd">0</span> | 涟漪:<span id="rd">0</span></div>
  </div>

  <!-- 关卡进度条 -->
  <div id="pb"><div class="pbf" id="pbf"></div></div>

  <!-- 技能栏 -->
  <div id="sb">
    <div class="sc" id="sk1" title="寸光回溯(E) — 重置当前所有障碍">回</div>
    <div class="sc" id="sk2" title="丹心护体(Q) — 英灵挡伤害(最多3次)">护</div>
    <div class="sc" id="sk3" title="山河移步(R) — 清除障碍但后续更多">移</div>
    <div class="sc" id="sk4" title="妄念改写(T) — 减速+短暂无敌">改</div>
    <div class="sc" id="sk5" title="天命解封(Y) — 清屏无敌，下关双倍伤害">解</div>
  </div>

  <!-- 叙事文本框 -->
  <div id="nt"><span class="ntn" id="ntn"></span><br><span id="ntt"></span></div>
  <div id="sh"></div>

  <!-- 过场 -->
  <div id="tsc">
    <div class="tscn" id="tscn"></div>
    <div class="tscs" id="tscs"></div>
    <div class="tsct" id="tsct"></div>
  </div>

  <!-- 主覆盖层 -->
  <div id="ol" class="active">
    <div id="ts">
      <div class="gt">溯 世 行</div>
      <div class="st">—— 宿命国风横版跑酷 ——</div>
      <div class="info">
        <span class="kw">空格/点击</span> 跳跃(二段) · <span class="kw">Shift/S</span> 滑铲<br>
        <span class="kw">E</span> 寸光回溯 · <span class="kw">Q</span> 丹心护体 · <span class="kw">R</span> 山河移步<br>
        <span class="kw">T</span> 妄念改写 · <span class="kw">Y</span> 天命解封<br>
        每使用一次改命技能，都将付出不可逆的代价
      </div>
      <button class="btn" id="bs" onclick="start()">踏 入 时 空</button>
    </div>
    <div id="gos">
      <div class="got">长河无尽</div>
      <div class="gosc" id="fs"></div>
      <div class="gost" id="et"></div>
      <div class="gosd" id="esd"></div>
      <button class="btn" onclick="restart()">再 入 轮 回</button>
    </div>
    <!-- 移动端技能按钮 -->
    <div id="mbs">
      <button class="mb" id="mb1" ontouchstart="useRewind()">E<br>回溯</button>
      <button class="mb" id="mb2" ontouchstart="useDanxin()">Q<br>护体</button>
      <button class="mb" id="mb3" ontouchstart="useMove()">R<br>移步</button>
      <button class="mb" id="mb4" ontouchstart="useRewrite()">T<br>改写</button>
      <button class="mb" id="mb5" ontouchstart="useUnseal()">Y<br>解封</button>
    </div>
  </div>
</div>

<!-- 游戏模块加载顺序：数据 → 渲染 → 引擎 → 主控 -->
<script src="js/config.js"></script>
<script src="js/art.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>

<script>
/* PWA: 注册 Service Worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
